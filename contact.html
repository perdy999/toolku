<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kontak - ToolKu</title>

<meta name="description" content="Hubungi ToolKu untuk pertanyaan, saran, atau laporan masalah.">
<meta name="robots" content="index, follow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
  line-height:1.7;
}

header{
  background:#2563eb;
  color:white;
  padding:25px 20px;
  text-align:center;
}

header h1{
  font-size:28px;
  margin-bottom:12px;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 10px;
  font-size:16px;
}

.container{
  max-width:800px;
  margin:35px auto;
  padding:0 20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}

h2{
  margin-bottom:12px;
  color:#111827;
}

p{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  margin-bottom:18px;
  font-family:inherit;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.email{
  background:#eff6ff;
  padding:18px;
  border-radius:10px;
  margin-bottom:25px;
}

.email a{
  color:#2563eb;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px 20px;
  color:#6b7280;
}

footer a{
  color:#2563eb;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <h1>ToolKu</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#tools">Tools</a>
    <a href="privacy.html">Privasi</a>
    <a href="terms.html">Ketentuan</a>
    <a href="contact.html">Kontak</a>
  </nav>
</header>

<div class="container">

<div class="card">

<h2>Hubungi Kami</h2>

<p>
Punya pertanyaan, saran, atau menemukan masalah pada salah satu tools ToolKu? Silakan hubungi kami.
</p>

<div class="email">

<strong>Email:</strong><br>

<a href="mailto:perdi.xyz@gmail.com">
perdi.xyz@gmail.com
</a>

</div>

<h2>Kirim Pesan</h2>

<form id="contactForm">

<label for="name">Nama</label>

<input
  type="text"
  id="name"
  placeholder="Nama kamu"
  required
>

<label for="email">Email</label>

<input
  type="email"
  id="email"
  placeholder="email@example.com"
  required
>

<label for="message">Pesan</label>

<textarea
  id="message"
  placeholder="Tulis pesan kamu..."
  required
></textarea>

<button type="submit">
Kirim Pesan
</button>

</form>

</div>

</div>

<footer>
  <p>© 2026 ToolKu - Tools Gratis Online</p>

  <p>
    <a href="index.html">Home</a> ·
    <a href="privacy.html">Privasi</a> ·
    <a href="terms.html">Ketentuan</a>
  </p>
</footer>

<script>

document.getElementById("contactForm").addEventListener("submit", function(e){

  e.preventDefault();

  const name =
    document.getElementById("name").value;

  const email =
    document.getElementById("email").value;

  const message =
    document.getElementById("message").value;

  const tujuan =
    "perdi.xyz@gmail.com";

  const subject =
    encodeURIComponent("Pesan dari ToolKu - " + name);

  const body =
    encodeURIComponent(
      "Nama: " + name +
      "\nEmail: " + email +
      "\n\nPesan:\n" + message
    );

  window.location.href =
    "mailto:" + tujuan +
    "?subject=" + subject +
    "&body=" + body;

});

</script>

</body>
</html>
